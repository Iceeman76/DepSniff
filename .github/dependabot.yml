version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /DepSniff
      - /DepSniff.Tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Keep MSBuild packages on the .NET 10-compatible 18.0.x line.
      # Review this constraint when upgrading the target framework and SDK.
      - dependency-name: Microsoft.Build
        versions: [">=18.1.0"]
      - dependency-name: Microsoft.Build.Framework
        versions: [">=18.1.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
