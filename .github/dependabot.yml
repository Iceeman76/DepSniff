version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /DepSniff
      - /DepSniff.Tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: Microsoft.Build.Framework
        versions: ["18.11.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
